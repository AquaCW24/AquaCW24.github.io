<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <title>清美園藝｜花卉介紹</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="清美園藝是位於新北市萬里區的花卉農場，提供杜鵑花、茶花等花卉。">
    <meta name="keywords" content="清美園藝, 花卉">
    <meta name="copyright" content="Che-Wen Kuo">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Figures/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <nav class="breadcrumb" aria-label="主要導覽">
            <a href="index.html">主頁</a>
            <a href="flowers.html">花卉介紹</a>
            <a href="contact.html">聯繫我們</a>
        </nav>
        <div class="header-mark" aria-label="農場標誌">FLOWER / FIELD</div>
    </header>
    <main>
        <section class="page-intro section-wrap">
            <p class="eyebrow">01 / CATALOG</p>
            <h1>花卉<span>介紹</span></h1>
        </section>
        <section class="catalog section-wrap" aria-labelledby="catalog-title">
            <div class="section-heading">
                <p class="eyebrow">THIS SEASON</p>
                <h2 id="catalog-title">本季花選</h2>
            </div>
            <article class="flower-card">
                <div class="flower-image-wrap">
                    <img src="Figures/Flowers_1.jpg" alt="本季花卉照片">
                    <span class="image-note">PHOTO / 01</span>
                </div>
                <div class="flower-info">
                    <div class="flower-number">NO. 01</div>
                    <h3>杜鵑花</h3>
                    <p class="flower-description">在這裡填入花卉的生長特色、花期、照顧方式，或是適合送禮與佈置的情境說明。</p>
                    <div class="flower-details">
                        <div><span>花期</span><strong>4月中旬至6月底</strong></div>
                        <div><span>尺寸</span><strong>10 cm至30 cm</strong></div>
                    </div>
                    <a class="text-link" href="contact.html">詢問花況 <span>↗</span></a>
                </div>
            </article>
        </section>
    </main>
    <footer class="site-footer"><div class="footer-bottom section-wrap"><span>© 2026 清美園藝</span><span>MADE WITH PATIENCE</span></div></footer>
