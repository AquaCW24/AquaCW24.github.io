<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <title>清美園藝｜主頁</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="清美園藝是位於新北市萬里區的花卉農場，提供杜鵑花、茶花等花卉。">
    <meta name="keywords" content="清美園藝, 花卉">
    <meta name="copyright" content="Che-Wen Kuo">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Figures/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="cursor" aria-hidden="true"></div>
    <div class="cursor-dot" aria-hidden="true"></div>

    <header class="site-header">
        <nav class="breadcrumb" aria-label="麵包屑導覽">
            <a href="index.html">主頁</a>
            <a href="flowers.html">花卉介紹</a>
            <a href="contact.html">聯繫我們</a>
        </nav>
        <div class="header-mark" aria-label="農場標誌">FLOWER / FIELD</div>
    </header>

    <main id="top">
        <section class="intro section-wrap">
            <p class="eyebrow">EST. 1996 · GROWN WITH CARE</p>
            <h1>清美園藝<span>，把季節送到你手上。</span></h1>
            <p class="intro-copy">從土地到花束，我們用心照料每一朵正在盛開的風景。<br>歡迎認識清美園藝。</p>
        </section>

        <section class="home-sections section-wrap" aria-label="主頁內容">
            <div class="section-heading">
                <p class="eyebrow">01 / ABOUT THE FARM</p>
                <h2>環境介紹</h2>
            </div>
            <div class="section-heading">
                <p class="eyebrow">02 / NEWS</p>
                <h2>最新消息</h2>
            </div>
        </section>
    </main>

    <footer class="site-footer"><div class="footer-bottom section-wrap"><span>© 2026 清美園藝</span><span>MADE WITH PATIENCE</span></div></footer>

    <script>
        const cursor = document.querySelector('.cursor');
        const cursorDot = document.querySelector('.cursor-dot');

        document.addEventListener('mousemove', (event) => {
            cursor.style.left = `${event.clientX - 10}px`;
            cursor.style.top = `${event.clientY - 10}px`;
            cursorDot.style.left = `${event.clientX - 2}px`;
            cursorDot.style.top = `${event.clientY - 2}px`;
        });

        document.addEventListener('mousedown', () => cursor.classList.add('is-pressed'));
        document.addEventListener('mouseup', () => cursor.classList.remove('is-pressed'));
    </script>
</body>
</html>
